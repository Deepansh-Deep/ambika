<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ambika Homoeopathy</title>
<meta name="description" content="Book your number online at Ambika Homoeopathy, Jainamore, Bokaro. Live queue, Dr. N. K. Prajapati, BHMS.">
<meta name="theme-color" content="#7B1216">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE4; --card:#FFFDF8; --ink:#1E1915; --muted:#6E645A; --line:#E6DccE;
  --red:#A11D21; --red-d:#741115; --red-l:#F8E6E3;
  --green:#2E5E4E; --green-l:#E3EEE8; --gold:#C49A3A; --amber:#B7791F; --amber-l:#FBF0DA;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 8px 28px -10px rgba(60,30,10,.18);
  --r:22px;
  --serif:"Fraunces",Georgia,serif; --deva:"Tiro Devanagari Hindi","Mukta",serif; --sans:"Mukta",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:16.5px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 110% -10%,rgba(161,29,33,.08),transparent 60%),radial-gradient(900px 500px at -20% 30%,rgba(46,94,78,.07),transparent 60%);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.wrap{max-width:540px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:980px}
.hi .h-deva,.h-deva{font-family:var(--deva)}

/* demo strip */
.demo{background:#22201d;color:#f3e9d6;font-size:13px;text-align:center;padding:7px 12px calc(7px);padding-top:calc(7px + env(safe-area-inset-top))}
.demo b{color:#f0c674}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px;padding-top:calc(18px + env(safe-area-inset-top))}
.demo + .wrap .top{padding-top:18px}
.logo{width:48px;height:48px;flex:none;border-radius:14px;background:linear-gradient(145deg,var(--red),var(--red-d));display:grid;place-items:center;box-shadow:0 6px 16px -6px rgba(116,17,21,.6)}
.brand{flex:1;min-width:0}
.brand .en{font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.1}
.brand .hn{font-family:var(--deva);font-size:15px;color:var(--red);line-height:1.2;margin-top:2px}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.lang button{padding:5px 11px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}

.notice{background:var(--amber-l);border:1px solid #EBD3A4;color:#6B4A10;border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;font-weight:500}

/* live board */
.board{position:relative;overflow:hidden;border-radius:26px;color:#FCEFE6;padding:18px 20px 16px;
  background:radial-gradient(500px 220px at 85% 0%,rgba(255,200,150,.18),transparent 60%),linear-gradient(155deg,#A11D21 0%,#7B1216 55%,#5A0D10 100%);
  box-shadow:0 20px 40px -18px rgba(90,13,16,.65)}
.board:after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 30px rgba(255,255,255,.025),0 0 0 60px rgba(255,255,255,.02)}
.b-head{display:flex;align-items:center;gap:10px;font-size:14px;opacity:.95}
.live{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px 3px 8px;font-weight:700;font-size:12px;letter-spacing:.08em}
.live i{width:8px;height:8px;border-radius:50%;background:#7CF0A9;box-shadow:0 0 0 0 rgba(124,240,169,.7);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,240,169,.6)}70%{box-shadow:0 0 0 9px rgba(124,240,169,0)}100%{box-shadow:0 0 0 0 rgba(124,240,169,0)}}
.b-head .date{margin-left:auto;opacity:.8}
.b-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px;position:relative;z-index:1}
.lbl{font-size:14px;opacity:.85}
.bignum{font-family:var(--serif);font-weight:600;font-size:96px;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin-top:4px}
.bignum small{font-size:40px;opacity:.55;margin-right:2px;letter-spacing:0}
.bump{animation:bump .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{0%{transform:scale(.7);opacity:.2}100%{transform:scale(1);opacity:1}}
.b-sub{font-size:14px;opacity:.85;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 16px;text-align:right}
.stats b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;opacity:.8}
.b-foot{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:600;font-size:14px}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.board .pill.open{background:#E2F6EA;color:#17603A}
.board .pill.closed{background:rgba(255,255,255,.14);color:#FFE3C8}
.b-foot .sits{opacity:.9;margin-left:auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-top:16px}
.card h2{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em;line-height:1.2}
.hi .card h2{font-family:var(--deva);font-weight:400;font-size:23px}
.card .sub{color:var(--muted);font-size:15px;margin-top:4px}

/* my tokens */
.mine{margin-top:16px;display:grid;gap:12px}
.mtk{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;overflow:hidden}
.mtk .stub{background:var(--green);color:#fff;padding:14px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:104px;position:relative}
.mtk .stub:after{content:"";position:absolute;right:-1px;top:8px;bottom:8px;border-right:2px dashed rgba(255,253,248,.9)}
.mtk .stub span{font-size:12px;opacity:.85}
.mtk .stub b{font-family:var(--serif);font-size:48px;line-height:1;font-weight:600}
.mtk .body{padding:14px 16px}
.mtk .who{font-weight:600;font-size:17px}
.mtk .msg{font-size:15px;color:var(--muted);margin-top:2px}
.mtk .big{font-size:18px;font-weight:600;color:var(--ink);margin-top:6px}
.mtk.in .stub{background:var(--red);animation:glow 1.6s infinite alternate}
@keyframes glow{to{background:#C4262B}}
.mtk.in .big{color:var(--red)}
.mtk.done .stub{background:#8A8178}
.mtk.skipped .stub,.mtk.cancelled .stub{background:var(--amber)}
.bar{height:6px;background:var(--line);border-radius:6px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#4E8C76);border-radius:6px;transition:width .6s}

/* form */
.field{margin-top:14px}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.inp{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(46,94,78,.12)}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 4px rgba(161,29,33,.1)}
.phone{display:flex;align-items:stretch}
.phone .cc{display:grid;place-items:center;padding:0 12px;border:1.5px solid var(--line);border-right:0;border-radius:14px 0 0 14px;background:#F8F3EA;font-weight:600;color:var(--muted)}
.phone .inp{border-radius:0 14px 14px 0}
.err{color:var(--red);font-size:14px;margin-top:5px;display:none}
.err.show{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 22px;border-radius:16px;font-weight:700;font-size:17px;transition:transform .08s,filter .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#B32328,var(--red-d));color:#fff;box-shadow:0 10px 22px -10px rgba(116,17,21,.8)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.closedbox{margin-top:14px;background:#F6F1E8;border:1px dashed #D9CBB5;border-radius:16px;padding:14px 16px;color:var(--muted);font-size:15px;display:flex;gap:10px;align-items:flex-start}
fieldset{border:0}
fieldset[disabled] .inp{background:#F7F3EC}

/* queue chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{min-width:42px;height:42px;padding:0 8px;border-radius:12px;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px;background:#fff;border:1.5px solid var(--line);font-variant-numeric:tabular-nums}
.chip.done{background:#EFEAE2;color:#A39A8F;border-color:#EFEAE2;text-decoration:line-through;text-decoration-thickness:1.5px}
.chip.in{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 6px 14px -6px rgba(161,29,33,.8)}
.chip.skipped{background:var(--amber-l);color:var(--amber);border-color:#F0D9A8}
.chip.cancelled{opacity:.35}
.chip.me{outline:2.5px solid var(--green);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);background:#fff}
.legend i.in{background:var(--red);border-color:var(--red)}
.legend i.done{background:#EFEAE2;border-color:#EFEAE2}
.legend i.skipped{background:var(--amber-l);border-color:#F0D9A8}
.legend i.me{outline:2px solid var(--green);outline-offset:1px}
.empty{color:var(--muted);font-size:15px;margin-top:10px}

/* doctor */
.doc{padding:0;overflow:hidden}
.doc .photo{position:relative;aspect-ratio:4/3.3;background:#ddd center 18%/cover no-repeat}
.doc .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(20,10,5,.78))}
.doc .cap{position:absolute;left:18px;right:18px;bottom:14px;color:#fff;z-index:1}
.doc .cap .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.doc .cap h3{font-family:var(--serif);font-weight:600;font-size:27px;line-height:1.1;margin-top:2px}
.doc .cap p{font-size:14px;opacity:.9}
.doc .info{padding:16px 18px 18px;display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.row .ic{width:36px;height:36px;border-radius:11px;background:var(--green-l);color:var(--green);display:grid;place-items:center;flex:none}
.row .t{font-size:13px;color:var(--muted)}
.row .v{font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.actions a{text-decoration:none}

/* how */
.steps{display:grid;gap:12px;margin-top:14px;counter-reset:s}
.step{display:flex;gap:12px;align-items:center}
.step b{counter-increment:s;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.step b:before{content:counter(s)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:26px;display:grid;gap:6px}
footer a{color:var(--muted)}
.install{display:none;margin-top:12px}

/* modal + ticket */
.scrim{position:fixed;inset:0;background:rgba(25,15,10,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
@media(min-width:620px){.scrim{align-items:center}}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:460px;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow:auto}
@media(min-width:620px){.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:22px;font-weight:600}
.hi .sheet h3{font-family:var(--deva);font-weight:400}
.sheet p{color:var(--muted);margin-top:6px}
.sheet .btns{display:grid;gap:10px;margin-top:18px}
.ticket{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#FFFDF8,#FBF3E6);border:1px solid var(--line)}
.ticket .tt{background:linear-gradient(150deg,var(--red),var(--red-d));color:#FCEFE6;padding:14px 18px;display:flex;align-items:center;gap:10px}
.ticket .tt .n{font-family:var(--serif);font-weight:700;font-size:16px;letter-spacing:.02em}
.ticket .tt .d{margin-left:auto;font-size:13px;opacity:.85}
.ticket .tn{text-align:center;padding:18px 10px 8px}
.ticket .tn .l{font-size:14px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ticket .tn b{display:block;font-family:var(--serif);font-weight:700;font-size:112px;line-height:1;letter-spacing:-.04em;color:var(--red);font-variant-numeric:tabular-nums}
.ticket .tw{text-align:center;font-weight:600;font-size:18px}
.ticket .tw span{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.perf{position:relative;height:28px;margin-top:10px}
.perf:before{content:"";position:absolute;left:18px;right:18px;top:50%;border-top:2px dashed var(--line)}
.perf i{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;background:var(--card);transform:translateY(-50%);border:1px solid var(--line)}
.perf i:first-child{left:-15px}.perf i:last-child{right:-15px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 18px 18px;text-align:center}
.tf div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.tf b{display:block;font-family:var(--serif);font-size:20px}
.tf span{font-size:12.5px;color:var(--muted)}
.tnote{text-align:center;font-size:13px;color:var(--muted);margin-top:12px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:500;z-index:80;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:up .25s;max-width:92vw;text-align:center}

/* ===== admin ===== */
.adm-top{display:flex;align-items:center;gap:12px;padding:16px 0;padding-top:calc(16px + env(safe-area-inset-top))}
.adm-top .who{margin-left:auto;text-align:right;font-size:13px;color:var(--muted);line-height:1.25}
.adm-top .who b{display:block;color:var(--ink);font-size:14px}
.role{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--green-l);color:var(--green);margin-top:3px}
.role.owner{background:var(--red-l);color:var(--red)}
.tabs{display:flex;gap:6px;background:#EDE5D8;padding:4px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;height:40px;border-radius:11px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.grid2{display:grid;gap:16px}
@media(min-width:860px){.grid2{grid-template-columns:1.05fr 1fr;align-items:start}.grid2 .card{margin-top:0}}
.now{background:linear-gradient(155deg,#A11D21,#6A0F13);color:#FCEFE6;border:0}
.now .top2{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.9}
.now .nn{display:flex;align-items:flex-end;gap:16px;margin-top:6px}
.now .nn b{font-family:var(--serif);font-size:88px;line-height:.9;font-weight:600;letter-spacing:-.04em}
.now .nn .p{padding-bottom:8px}
.now .nn .p .nm{font-size:22px;font-weight:600;line-height:1.15}
.now .nn .p .pl{opacity:.85}
.now .nn .p a{color:#FFD9B8;font-weight:600;text-decoration:none}
.now .ctrl{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:18px}
.now .ctrl .btn{height:58px;font-size:16px;padding:0 10px}
.now .ctrl .b1{background:#FFF6EC;color:var(--red-d)}
.now .ctrl .b2,.now .ctrl .b3{background:rgba(255,255,255,.12);color:#fff}
.upnext{margin-top:14px;font-size:14px;opacity:.9}
.upnext span{display:inline-block;background:rgba(255,255,255,.12);border-radius:999px;padding:2px 10px;margin:4px 6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.kpi b{font-family:var(--serif);font-size:26px;font-weight:600;display:block;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.regctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.regctl .pill.open{background:#E2F6EA;color:#17603A}
.regctl .pill.closed{background:#F1EBE1;color:var(--muted)}
.sbtn{height:36px;padding:0 14px;border-radius:11px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.sbtn.red{border-color:#E9C2BF;color:var(--red)}
.sbtn.green{border-color:#BFD6CB;color:var(--green)}
.sbtn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted);background:#fff}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.list{margin-top:12px;display:grid;gap:8px}
.it{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.it .no{font-family:var(--serif);font-weight:600;font-size:24px;text-align:center}
.it .nm{font-weight:600;line-height:1.2}
.it .meta{font-size:13px;color:var(--muted)}
.it .meta a{color:var(--green);font-weight:600;text-decoration:none}
.st{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.st.waiting{background:var(--green-l);color:var(--green)}
.st.in{background:var(--red);color:#fff}
.st.done{background:#EEE8DF;color:#8A8178}
.st.skipped{background:var(--amber-l);color:var(--amber)}
.nfy{margin-top:10px;font-size:14px;color:var(--muted)}
.nfy .btn{min-height:44px;font-size:15px}
.nfy p{margin:6px 2px 0;line-height:1.4}
.nfy.on,.nfy.warn{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:12px;background:#E7F3EC;color:#1F5E3A}
.nfy.warn{background:#FBF0E1;color:#7A4B00}
.nfy.on svg,.nfy.warn svg{flex:none;margin-top:1px}
.nfy.big{margin:14px 0 4px;text-align:center}
.st.bell{background:#E7F3EC;color:#1F5E3A;padding:2px 6px;display:inline-flex;align-items:center}
.st.bell svg{width:13px;height:13px}
.st.prio{background:#FBE9C6;color:#7A4B00}
.st.cancelled{background:#F1E4E3;color:#9B6B68}
.src{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px}
.it.in{border-color:var(--red);box-shadow:0 0 0 3px rgba(161,29,33,.1)}
.it.done,.it.cancelled{opacity:.6}
.it .acts{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center}

.menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.3);padding:6px;min-width:190px}
.menu button{display:flex;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-weight:500;gap:10px}
.menu button:hover{background:#F6F1E8}
.menu button.danger{color:var(--red)}
.form-grid{display:grid;gap:14px;margin-top:6px}
@media(min-width:620px){.form-grid.two{grid-template-columns:1fr 1fr}}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{height:38px;min-width:48px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-weight:600}
.days button.on{background:var(--red);border-color:var(--red);color:#fff}
.sec{font-family:var(--serif);font-size:17px;font-weight:600;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.people{display:grid;gap:8px;margin-top:10px}
.person{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--green-l);color:var(--green);display:grid;place-items:center;font-weight:700;flex:none;text-transform:uppercase}
.person .e{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.center{min-height:70vh;display:grid;place-items:center;text-align:center}
.login{max-width:400px;width:100%}
.login .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 14px}
.login h1{font-family:var(--serif);font-weight:600;font-size:28px}
.login p{color:var(--muted);margin-top:6px}
.gbtn{background:#fff;border:1.5px solid var(--line);box-shadow:var(--shadow)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp 0.8s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.warn{background:var(--amber-l);border:1px solid #EBD3A4;color:#6B4A10;border-radius:14px;padding:12px 14px;font-size:14.5px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.card .pill.open{background:#E2F6EA;color:#17603A}
.card .pill.closed{background:#F1EBE1;color:var(--muted)}
.meta .nw{white-space:nowrap}

/* ================================================================ BACKENDS
   Both backends expose the same interface:
   onSettings(cb) onDay(key,cb) onTokens(key,cb) onContacts(key,cb) onRoles(cb) onAuth(cb)
   register(key,{name,place,phone},by) adminWrite(key,changes,current)
   saveSettings(s) saveRoles(r) claim() signIn(opt) signOut() cleanup(key)
   ================================================================ */

function makeDemoBackend() {
  const LS = "ambika_demo_v1";
  let st = store.get(LS, null);
  const subs = new Set();
  const emit = () => subs.forEach((f) => f());
  const save = () => { store.set(LS, st); emit(); };
  addEventListener("storage", (e) => { if (e.key === LS) { st = store.get(LS, st); emit(); } });
  if (!st) {
    const key = dayKeyFor(DEFAULTS);
    const people = [["Sunita Devi","Jainamore"],["Ramesh Mahto","Chas"],["Anita Kumari","Bokaro Sec 4"],["Mohan Lal","Bermo"],["Pooja Singh","Tupkadih"],["Rakesh Kumar","Jaridih"],["Sushila Devi","Kasmar"],["Vikash Kumar","Petarwar"],["Kavita Mahato","Gomia"],["Ajay Kumar","Bandhdih"],["Rina Devi","Jaina"],["Santosh Ravani","Phusro"],["Meena Kumari","Chandankiyari"],["Dilip Turi","Pindrajora"]];
    const tokens = {}, contacts = {};
    const t0 = Date.UTC(+key.slice(0,4), +key.slice(4,6) - 1, +key.slice(6,8), 3, 30); // 9:00 AM IST
    people.forEach(([name, place], i) => {
      const no = i + 1;
      const status = no <= 5 ? "done" : no === 6 ? "skipped" : no === 7 ? "in" : "waiting";
      tokens[no] = { no, status, by: no % 4 === 0 ? "walkin" : "online", createdAt: Math.min(Date.now(), t0 + i * 420e3), at: no <= 7 ? Date.now() - (8 - no) * 360e3 : 0 };
      contacts[no] = { name, place, phone: "98765" + String(10000 + no).slice(1) };
    });
    st = {
      settings: { ...DEFAULTS, forceOpenDay: key },
      roles: { owners: ["deepansh@demo.app", "doctor@demo.app"], admins: ["reception@demo.app"] },
      auth: null,
      days: { [key]: { next: people.length, current: 7, tokens, contacts, guard: {} } },
    };
    store.set(LS, st);
  }
  const on = (sel, cb) => { const f = () => cb(sel()); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  const day = (k) => (st.days[k] ||= { next: 0, current: 0, tokens: {}, contacts: {}, guard: {} });
  const roleOf = (email) => !email ? null : st.roles.owners.includes(email) ? "owner" : st.roles.admins.includes(email) ? "admin" : "none";
  const wait = (ms = 250) => new Promise((r) => setTimeout(r, ms));
  return {
    mode: "demo",
    onSettings: (cb) => on(() => ({ ...DEFAULTS, ...st.settings, _unset: !st.settings }), cb),
    onDay: (k, cb) => on(() => ({ next: st.days[k]?.next || 0, current: st.days[k]?.current || 0 }), cb),
    onTokens: (k, cb) => on(() => Object.values(st.days[k]?.tokens || {}).map((t) => ({ ...t })).sort((a, b) => a.no - b.no), cb),
    onContacts: (k, cb) => on(() => ({ ...(st.days[k]?.contacts || {}) }), cb),
    onRoles: (cb) => on(() => JSON.parse(JSON.stringify(st.roles)), cb),
    onAuth: (cb) => on(() => st.auth ? { ...st.auth, role: roleOf(st.auth.email) } : null, cb),
    async signIn(email) { await wait(); st.auth = { email, name: email.split("@")[0] }; save(); },
    async signOut() { st.auth = null; save(); },
    async claim() {},
    async register(k, { name, place, phone }, by) {
      await wait(450);
      const s = { ...DEFAULTS, ...st.settings };
      if (by === "online") {
        const rs = regState(s, k, st.days[k]?.next || 0);
        if (rs !== "open") throw Object.assign(new Error("closed"), { code: "permission-denied" });
      }
      const d = day(k);
      const g = phone ? await guardId(phone, name) : null;
      if (g && d.guard[g]) return { no: d.guard[g], existing: true };
      if (by === "online" && phone) {
        d.phones ||= {};
        if ((d.phones[phone] || 0) >= 2) throw Object.assign(new Error("phone-limit"), { code: "phone-limit" });
        d.phones[phone] = (d.phones[phone] || 0) + 1;
      }
      const no = d.next + 1; d.next = no;
      d.tokens[no] = { no, status: "waiting", by, createdAt: Date.now(), at: 0 };
      d.contacts[no] = { name, place, phone: phone || "" };
      if (g) d.guard[g] = no;
      save(); return { no, existing: false };
    },
    async adminWrite(k, changes, current) {
      const d = day(k);
      for (const [no, ch] of Object.entries(changes)) if (d.tokens[no]) Object.assign(d.tokens[no], ch, { at: Date.now() });
      if (current !== undefined) d.current = current;
      save();
    },
    async saveSettings(s) { st.settings = { ...s }; delete st.settings._unset; save(); },
    async patchSettings(p) { st.settings = { ...(st.settings || {}), ...p }; save(); },
    async saveRoles(r) { st.roles = r; save(); },
    async cleanup(k) { for (const key of Object.keys(st.days)) if (key !== k) delete st.days[key]; save(); },
    async resetDemo() { localStorage.removeItem(LS); location.reload(); },
    onPush: (k, cb) => on(() => JSON.parse(JSON.stringify(st.days[k]?.push || {})), cb),
    async savePush(k, no, sub, lang) { const d = day(k); d.push ||= {}; d.push[no] = { ...(d.push[no] || {}), sub, lang }; save(); },
    async markPush(k, no, stage, on = true) { const p = day(k).push?.[no]; if (!p) return false; p.sent ||= {}; if (on && p.sent[stage]) return false; p.sent[stage] = on; save(); return true; },
    async sendPush(items) { console.log("[demo push]", items); toast("Demo: notified " + items.map((i) => "#" + i.id).join(", ")); },
  };
}

async function makeFirebaseBackend(cfg) {
  const V = "10.12.2", B = `https://www.gstatic.com/firebasejs/${V}/`;
  const [A, F, AU] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-firestore.js"), import(B + "firebase-auth.js")]);
  const app = A.initializeApp(cfg);
  if (APP_CHECK_SITE_KEY) {
    try {
      const AC = await import(B + "firebase-app-check.js");
      AC.initializeAppCheck(app, { provider: new AC.ReCaptchaV3Provider(APP_CHECK_SITE_KEY), isTokenAutoRefreshEnabled: true });
    } catch (e) { console.error("App Check failed to start", e); }
  }
  const db = F.getFirestore(app);
  const auth = AU.getAuth(app);
  const { doc, collection, onSnapshot, runTransaction, getDoc, getDocs, setDoc, writeBatch, serverTimestamp } = F;
  const ms = (v) => (v && v.toMillis ? v.toMillis() : v || 0);
  const errLog = (e) => { console.error(e); toast("Sync error: " + (e.code || e.message)); };
  let authCb = null, lastUser = null;
  async function resolveRole(u) {
    if (!u) return null;
    const email = (u.email || "").toLowerCase();
    let role = "none";
    try {
      const r = await getDoc(doc(db, "config", "roles"));
      if (!r.exists()) role = "unclaimed";
      else { const d = r.data(); role = (d.owners || []).includes(email) ? "owner" : (d.admins || []).includes(email) ? "admin" : "none"; }
    } catch (e) { role = "none"; }
    return { email, name: u.displayName || email, role };
  }
  return {
    mode: "live",
    onSettings: (cb) => onSnapshot(doc(db, "config", "settings"), (s) => cb(s.exists() ? { ...DEFAULTS, ...s.data(), _unset: false } : { ...DEFAULTS, _unset: true }), errLog),
    onDay: (k, cb) => onSnapshot(doc(db, "days", k), (s) => cb(s.exists() ? { next: s.data().next || 0, current: s.data().current || 0 } : { next: 0, current: 0 }), errLog),
    onTokens: (k, cb) => onSnapshot(collection(db, "days", k, "tokens"), (qs) => cb(qs.docs.map((d) => { const x = d.data(); return { ...x, createdAt: ms(x.createdAt), at: ms(x.at) }; }).sort((a, b) => a.no - b.no)), errLog),
    onContacts: (k, cb) => onSnapshot(collection(db, "days", k, "contacts"), (qs) => { const o = {}; qs.docs.forEach((d) => (o[d.id] = d.data())); cb(o); }, errLog),
    onRoles: (cb) => onSnapshot(doc(db, "config", "roles"), (s) => cb(s.exists() ? s.data() : { owners: [], admins: [] }), errLog),
    onAuth(cb) { authCb = cb; return AU.onAuthStateChanged(auth, async (u) => { lastUser = u; cb(await resolveRole(u)); }); },
    async signIn() {
      const p = new AU.GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
      try { await AU.signInWithPopup(auth, p); }
      catch (e) { if (/popup/.test(e.code || "")) await AU.signInWithRedirect(auth, p); else throw e; }
    },
    async signOut() { await AU.signOut(auth); },
    async claim() {
      const email = (auth.currentUser?.email || "").toLowerCase();
      await setDoc(doc(db, "config", "roles"), { owners: [email], admins: [] });
      const s = { ...DEFAULTS }; await setDoc(doc(db, "config", "settings"), s);
      authCb && authCb(await resolveRole(lastUser));
    },
    async register(k, { name, place, phone }, by) {
      const g = phone ? await guardId(phone, name) : null;
      const attempt = (slot) => runTransaction(db, async (tx) => {
        const dref = doc(db, "days", k);
        const gref = g ? doc(db, "days", k, "guard", g) : null;
        const ds = await tx.get(dref);
        if (gref) { const gs = await tx.get(gref); if (gs.exists()) return { no: gs.data().no, existing: true }; }
        const no = (ds.exists() ? ds.data().next || 0 : 0) + 1;
        if (ds.exists()) tx.update(dref, { next: no, updatedAt: serverTimestamp() });
        else tx.set(dref, { next: no, current: 0, updatedAt: serverTimestamp() });
        tx.set(doc(db, "days", k, "tokens", String(no)), { no, status: "waiting", by, createdAt: serverTimestamp() });
        tx.set(doc(db, "days", k, "contacts", String(no)), { name, place, phone: phone || "" });
        if (gref) tx.set(gref, { no });
        if (slot) tx.set(doc(db, "days", k, "guard", "ph_" + phone + "_" + slot), { no }); // max 2 numbers per phone per day
        return { no, existing: false };
      });
      if (by !== "online" || !phone) return attempt(0); // walk-ins added by staff are not limited
      try { return await attempt(1); } catch (e) { if (!String(e.code || "").includes("permission")) throw e; }
      try { return await attempt(2); } catch (e) {
        if (String(e.code || "").includes("permission")) throw Object.assign(new Error("phone-limit"), { code: "phone-limit" });
        throw e;
      }
    },
    async adminWrite(k, changes, current) {
      const b = writeBatch(db);
      for (const [no, ch] of Object.entries(changes)) b.update(doc(db, "days", k, "tokens", String(no)), { ...ch, at: serverTimestamp() });
      if (current !== undefined) b.set(doc(db, "days", k), { current, updatedAt: serverTimestamp() }, { merge: true });
      await b.commit();
    },
    async saveSettings(s) { const c = { ...s }; delete c._unset; await setDoc(doc(db, "config", "settings"), c); },
    async patchSettings(p) { await setDoc(doc(db, "config", "settings"), p, { merge: true }); },
    async saveRoles(r) { await setDoc(doc(db, "config", "roles"), r); },
    onPush: (k, cb) => onSnapshot(collection(db, "days", k, "push"), (qs) => { const o = {}; qs.docs.forEach((d) => (o[d.id] = d.data())); cb(o); }, errLog),
    async savePush(k, no, sub, lang) { await setDoc(doc(db, "days", k, "push", String(no)), { sub, lang, at: serverTimestamp() }, { merge: true }); },
    async markPush(k, no, stage, on = true) {
      const ref = doc(db, "days", k, "push", String(no));
      return runTransaction(db, async (tx) => {
        const d = await tx.get(ref);
        if (!d.exists() || (on && d.data().sent?.[stage])) return false;
        tx.update(ref, { ["sent." + stage]: on }); return true;
      });
    },
    async sendPush(items) {
      const tok = await auth.currentUser?.getIdToken(); if (!tok) throw new Error("not signed in");
      const r = await fetch(PUSH_URL, { method: "POST", headers: { Authorization: "Bearer " + tok, "Content-Type": "application/json" }, body: JSON.stringify({ items }) });
      if (!r.ok) throw new Error("push server " + r.status);
      const j = await r.json().catch(() => ({}));
      const k = items[0]?.day;
      for (const x of j.results || []) if ((x.status === 404 || x.status === 410) && k) F.deleteDoc(doc(db, "days", k, "push", String(x.id))).catch(() => {});
      return j;
    },
    async cleanup(k) {
      // Daily wipe: delete every older day (tokens, contacts, guards, day doc).
      const days = await getDocs(collection(db, "days"));
      for (const d of days.docs) {
        if (d.id >= k) continue;
        const refs = [];
        for (const sub of ["tokens", "contacts", "guard", "push"]) (await getDocs(collection(db, "days", d.id, sub))).docs.forEach((x) => refs.push(x.ref));
        refs.push(d.ref);
        for (let i = 0; i < refs.length; i += 400) { const b = writeBatch(db); refs.slice(i, i + 400).forEach((r) => b.delete(r)); await b.commit(); }
      }
    },
  };
}

const tl = (lang, k, vars = {}) => (TXT[lang]?.[k] ?? TXT.en[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v]);
const t = (k, vars = {}) => tl(S.lang, k, vars);

function regState(s, key, next) {
  if (s._unset) return "paused";
  if (s.closedDay === key) return "closed";
  if (s.paused) return "paused";
  if (s.maxTokens > 0 && next >= s.maxTokens) return "full";
  if (s.forceOpenDay === key) return "open";
  if ((s.offDays || []).includes(isoDow())) return "off";
  const m = nowMin();
  if (m < s.openMin) return "before";
  if (m >= s.closeMin) return "after";
  return "open";
}
const regLabel = () => { const rs = regState(S.settings, S.key, S.day.next); return { rs, text: t(rs, { t: fmt(S.settings.openMin) }) }; };
const isAdmin = () => S.auth && (S.auth.role === "owner" || S.auth.role === "admin");
const isOwner = () => S.auth && S.auth.role === "owner";

/* ================================================================ SUBSCRIPTIONS */
function subscribeDay() {
  unsubDay.forEach((u) => u && u()); unsubDay = [];
  const k = S.key;
  unsubDay.push(backend.onDay(k, (d) => { const prev = S.day.current; S.day = d; S.loaded = true; update(prev !== d.current); }));
  unsubDay.push(backend.onTokens(k, (list) => { S.tokens = list; update(); }));
  subscribeAdmin();
}
function subscribeAdmin() {
  unsubAdmin.forEach((u) => u && u()); unsubAdmin = [];
  if (!isAdmin()) { S.contacts = {}; return; }
  unsubAdmin.push(backend.onContacts(S.key, (c) => { S.contacts = c; update(); }));
  if (isOwner()) unsubAdmin.push(backend.onRoles((r) => { S.roles = r; update(); }));
  S.push = {};
  if (PUSH_URL || backend.mode === "demo") unsubAdmin.push(backend.onPush(S.key, (p) => { S.push = p; pushTick(); if (lastView === "admin") renderAdmin(true); }));
}
function checkDayRollover() {
  const k = dayKeyFor(S.settings);
  if (k !== S.key) { S.key = k; S.day = { next: 0, current: 0 }; S.tokens = []; S.contacts = {}; S.push = {}; subscribeDay(); if (isAdmin()) backend.cleanup(k).catch(() => {}); }
}

function counts() {
  const c = { waiting: 0, done: 0, skipped: 0, in: 0, cancelled: 0 };
  S.tokens.forEach((x) => c[x.status] = (c[x.status] || 0) + 1);
  return c;
}
// Queue order: priority patients (set by an owner) first, in the order they were bumped, then by booking number.
const rankKey = (x) => (x.prio ? [0, x.prio, x.no] : [1, 0, x.no]);
const byRank = (a, b) => { const ka = rankKey(a), kb = rankKey(b); return ka[0] - kb[0] || ka[1] - kb[1] || ka[2] - kb[2]; };
function aheadOf(no) {
  const me = S.tokens.find((x) => x.no === no);
  if (!me) return S.tokens.filter((x) => x.no < no && (x.status === "waiting" || x.status === "in")).length;
  return S.tokens.filter((x) => x !== me && (x.status === "in" || (x.status === "waiting" && byRank(x, me) < 0))).length;
}
function estFor(ahead) {
  const s = S.settings; const base = Math.max(nowMin(), s.sitFrom);
  return fmt(Math.round(base + ahead * avgConsult()));
}
// Minutes per patient: learnt from today's finished consultations once there are a few, else the setting.
function avgConsult() {
  const ts = S.tokens.filter((x) => x.status === "done" && x.at).map((x) => x.at).sort((a, b) => a - b);
  if (ts.length >= 4) return Math.min(20, Math.max(2, (ts[ts.length - 1] - ts[0]) / (ts.length - 1) / 60000));
  return S.settings.avgMin || 5;
}

/* ---------------------------------------------------------------- phone notifications */
const pushSupported = () => !!(PUSH_URL || backend?.mode === "demo") && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const pushNos = () => { const v = store.get("ambika_push", {}); return v.key === S.key ? v.nos || [] : []; };
function pushState(no) {
  if (!(PUSH_URL || backend?.mode === "demo")) return "none";
  if (isIOS() && !isStandalone() && !("PushManager" in window)) return "ios";
  if (!pushSupported()) return "none";
  if (Notification.permission === "denied") return "denied";
  return Notification.permission === "granted" && pushNos().includes(no) ? "on" : "off";
}
function notifyBlock(no, big = false) {
  const st = pushState(no);
  if (st === "none") return "";
  if (st === "on") return `<div class="nfy on">${ICON.bell}<span>${t("notifyOn")}</span></div>`;
  if (st === "ios") return `<div class="nfy warn">${ICON.bell}<span>${t("notifyIos")}</span></div>`;
  if (st === "denied") return `<div class="nfy warn">${ICON.bell}<span>${t("notifyDenied")}</span></div>`;
  return `<div class="nfy ${big ? "big" : ""}"><button class="btn primary block" data-notify="${no}" type="button">${ICON.bell}<span>${t("notifyBtn")}</span></button><p>${t("notifyHint")}</p></div>`;
}
function bindNotify(scope = document) {
  scope.querySelectorAll("[data-notify]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    const ok = await enablePush();
    if (ok) { const box = b.closest(".nfy"); if (box) box.outerHTML = notifyBlock(+b.dataset.notify); }
    else b.disabled = false;
  });
}
async function enablePush(silent = false) {
  const nos = S.mine.filter((m) => m.key === S.key).map((m) => m.no);
  if (!nos.length || !pushSupported()) return false;
  try {
    const perm = Notification.permission === "granted" ? "granted" : silent ? "default" : await Notification.requestPermission();
    if (perm !== "granted") { if (!silent) { toast(t("notifyDenied")); updateHome(); } return false; }
    const reg = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const raw = atob(VAPID_PUBLIC.replace(/-/g, "+").replace(/_/g, "/"));
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, (c) => c.charCodeAt(0)) });
    }
    const j = sub.toJSON();
    const clean = { endpoint: j.endpoint, keys: { p256dh: j.keys.p256dh, auth: j.keys.auth } };
    const done = pushNos();
    for (const no of nos) if (!done.includes(no) || !silent) await backend.savePush(S.key, no, clean, S.lang);
    store.set("ambika_push", { key: S.key, nos: [...new Set([...done, ...nos])] });
    if (!silent) { toast(t("notifyOn")); updateHome(); }
    return true;
  } catch (e) { console.error("push", e); if (!silent) toast(t("notifyFail")); return false; }
}

// Runs on the clinic console: whenever the queue moves, tell the patients whose turn is near.
let pushBusy = false, pushAgain = false;
async function pushTick() {
  if (!(PUSH_URL || backend?.mode === "demo") || !isAdmin() || !S.day.current || !S.tokens.length) return;
  if (pushBusy) { pushAgain = true; return; }
  pushBusy = true;
  const jobs = [], k = S.key;
  try {
    const avg = avgConsult();
    for (const [id, p] of Object.entries(S.push || {})) {
      const no = +id, tk = S.tokens.find((x) => x.no === no);
      if (!tk || !p?.sub) continue;
      const sent = p.sent || {}, a = aheadOf(no);
      let stage = null;
      if (tk.status === "in") { if (!sent.in) stage = "in"; }
      else if (tk.status === "waiting") {
        if (a <= 1) { if (!sent.next) stage = "next"; }
        else if (a <= PUSH_SOON && !sent.soon && !sent.next) stage = "soon";
      }
      if (!stage || !(await backend.markPush(k, no, stage))) continue;
      const L = p.lang === "en" ? "en" : "hi", key = { in: "pIn", next: "pNext", soon: "pSoon" }[stage];
      const m = Math.max(5, Math.round((a * avg) / 5) * 5);
      jobs.push({ id, day: k, stage, sub: p.sub, ttl: stage === "soon" ? 1200 : 900,
        payload: { title: tl(L, key + "T", { n: no }), body: tl(L, key + "B", { a, m }), tag: "ambika-" + no, url: "./", urgent: stage !== "soon", lang: L === "hi" ? "hi-IN" : "en-IN" } });
    }
    if (jobs.length) await backend.sendPush(jobs.map(({ stage, ...j }) => j));
  } catch (e) {
    console.warn("push send failed", e);
    for (const j of jobs) backend.markPush(k, j.id, j.stage, false).catch(() => {}); // retry on the next queue change
  } finally { pushBusy = false; if (pushAgain) { pushAgain = false; pushTick(); } }
}

async function onBook(e) {
  e.preventDefault();
  const name = $("#f-name").value.trim().replace(/\s+/g, " ");
  const place = $("#f-place").value.trim().replace(/\s+/g, " ");
  const phone = cleanPhone($("#f-phone").value);
  let ok = true;
  const bad = (f, cond) => { $("#f-" + f).classList.toggle("bad", cond); $("#e-" + f).classList.toggle("show", cond); if (cond && ok) $("#f-" + f).focus(); if (cond) ok = false; };
  bad("name", name.length < 2); bad("place", place.length < 2); bad("phone", !/^[6-9]\d{9}$/.test(phone));
  if (!ok) return;
  const btn = $("#bookbtn"); btn.disabled = true; btn.querySelector("span").textContent = t("booking");
  try {
    const r = await backend.register(S.key, { name: name.slice(0, 60), place: place.slice(0, 60), phone }, "online");
    if (!S.mine.some((m) => m.key === S.key && m.no === r.no)) {
      S.mine = [...S.mine.filter((m) => m.key === S.key), { key: S.key, no: r.no, name }];
      store.set("ambika_mine", S.mine);
    }
    $("#f-name").value = ""; $("#f-place").value = "";
    if (pushSupported() && Notification.permission === "granted") enablePush(true); // already allowed: cover the new number too
    showTicket(r.no, name, place, r.existing);
    updateHome();
  } catch (err) {
    console.error(err);
    if (err.code === "phone-limit" && regState(S.settings, S.key, S.day.next) === "open") toast(t("phoneLimit"));
    else toast(String(err.code || "").includes("permission") || err.code === "phone-limit" ? t("closedErr") : t("netErr"));
  } finally { btn.disabled = false; btn.querySelector("span").textContent = t("submit"); }
}

/* ---------------------------------------------------------------- modal / toast / menu */
function openModal(html, { onClose } = {}) {
  const mr = $("#modal-root");
  mr.innerHTML = `<div class="scrim">${html}</div>`;
  const sc = mr.firstElementChild;
  sc.addEventListener("click", (e) => { if (e.target === sc || e.target.closest("[data-close]")) { closeModal(); onClose && onClose(); } });
  return sc;
}
function closeModal() { $("#modal-root").innerHTML = ""; }
function confirmBox(title, body, okText = "Confirm", danger = true) {
  return new Promise((res) => {
    const sc = openModal(`<div class="sheet"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="btns"><button class="btn ${danger ? "primary" : "green"} block" data-ok>${esc(okText)}</button><button class="btn ghost block" data-close>Cancel</button></div></div>`, { onClose: () => res(false) });
    sc.querySelector("[data-ok]").onclick = () => { closeModal(); res(true); };
  });
}
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((x) => x.remove());
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 3200);
}
let menuEl = null;
function closeMenu() { menuEl?.remove(); menuEl = null; }
addEventListener("click", (e) => { if (menuEl && !menuEl.contains(e.target) && !e.target.closest("[data-menu]")) closeMenu(); });
addEventListener("scroll", closeMenu, { passive: true });

          <button class="btn b3" id="q-undo" ${lastDone ? "" : "disabled"} title="Bring back the previous number">Undo</button>
        </div>
        ${ups.length ? `<div class="upnext">Up next: ${ups.map((x) => `<span>#${x.no} ${esc(firstName(contactOf(x.no).name))}</span>`).join("")}</div>` : ""}
      </section>
      <div class="kpis">
        <div class="kpi"><b>${S.day.next}</b><span>Booked</span></div>
        <div class="kpi"><b>${c.waiting}</b><span>Waiting</span></div>
        <div class="kpi"><b>${c.done}</b><span>Done</span></div>
        <div class="kpi"><b>${c.skipped}</b><span>Absent</span></div>
      </div>
      <section class="card">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-family:var(--serif);font-weight:600;font-size:19px">Online booking</h2><span class="pill ${rs === "open" ? "open" : "closed"}" style="margin-left:auto">${text}</span></div>
        <p class="sub">Window ${fmt(S.settings.openMin)} – ${fmt(S.settings.closeMin)} · doctor ${fmt(S.settings.sitFrom)} – ${fmt(S.settings.sitTo)}${S.settings.maxTokens ? ` · max ${S.settings.maxTokens}` : ""}</p>
        <div class="regctl">
          ${S.settings.paused ? `<button class="sbtn green" data-reg="resume">Resume booking</button>` : `<button class="sbtn red" data-reg="pause">Pause booking</button>`}
          ${S.settings.closedDay && S.settings.closedDay >= S.key ? `<button class="sbtn green" data-reg="reopen">Cancel closure (${S.settings.closedDay === S.key ? "today" : "tomorrow"})</button>` : `<button class="sbtn red" data-reg="closeday">Doctor not sitting / Holiday</button>`}
          ${isOwner() ? (S.settings.forceOpenDay === S.key ? `<button class="sbtn" data-reg="unforce">Back to normal timing</button>` : `<button class="sbtn" data-reg="force">Open now for today</button>`) : ""}
          <button class="sbtn" id="announce">Announcement</button>
          <button class="sbtn dark" id="walkin" style="margin-left:auto">+ Add walk-in</button>
        </div>
      </section>
    </div>
    <section class="card" style="margin-top:0">
      <div style="display:flex;align-items:center;gap:10px"><h2 style="font-family:var(--serif);font-weight:600;font-size:19px">Today's list</h2><span class="hint" style="margin:0 0 0 auto">${S.tokens.length} total</span></div>
      <div class="filters">${[["active", "Active"], ["all", "All"], ["done", "Done"], ["skipped", "Absent"], ["cancelled", "Cancelled"]].map(([k, l]) => `<button data-f="${k}" class="${f === k ? "on" : ""}">${l}</button>`).join("")}</div>
      <div class="list">${list.length ? list.map(rowHTML).join("") : `<p class="empty">Nothing here.</p>`}</div>
    </section>
  </div>`;
}
function rowHTML(x) {
  const ct = contactOf(x.no);
  const time = x.createdAt ? new Date(x.createdAt + IST * 60000).toISOString().slice(11, 16) : "";
  return `<div class="it ${x.status}">
    <div class="no">${x.no}</div>
    <div><div class="nm">${esc(ct.name || "—")}<span class="st ${x.status}">${x.status === "skipped" ? "absent" : x.status === "in" ? "with doctor" : x.status}</span>${x.prio && x.status === "waiting" ? `<span class="st prio">priority</span>` : ""}${S.push?.[x.no] ? `<span class="st bell" title="Gets phone notifications">${ICON.bell}</span>` : ""}</div>
      <div class="meta">${esc(ct.place || "")}${ct.phone ? ` · <a class="nw" href="tel:+91${esc(ct.phone)}">${esc(ct.phone)}</a>` : ""}${time ? ` · <span class="nw">${fmt(fromHHMM(time))}</span>` : ""}<span class="src">${x.by === "walkin" ? "walk-in" : "online"}</span></div></div>
    <div class="acts">${x.status === "waiting" ? `<button class="ib" title="Call now" data-act="call" data-no="${x.no}">${ICON.call}</button>` : ""}<button class="ib" data-menu="${x.no}" title="More">${ICON.dots}</button></div>
  </div>`;
}
async function run(fn, okMsg) { try { await fn(); okMsg && toast(okMsg); } catch (e) { console.error(e); toast("Failed: " + (e.code || e.message)); } }
const A = {
  async next(markAs = "done") {
    const cur = inTok(); const ch = {};
    if (cur) ch[cur.no] = { status: markAs };
    const nx = nextWaiting(cur?.no);
    if (nx) ch[nx.no] = { status: "in" };
    await backend.adminWrite(S.key, ch, nx ? nx.no : 0);
    toast(nx ? `Calling #${nx.no}${contactOf(nx.no).name ? " · " + contactOf(nx.no).name : ""}` : "Queue finished");
  },
  async call(no) {
    const cur = inTok(); const ch = {};
    if (cur && cur.no !== no) ch[cur.no] = { status: "waiting" };
    ch[no] = { status: "in" };
    await backend.adminWrite(S.key, ch, no); toast(`Calling #${no}`);
  },
  async undo() {
    const last = S.tokens.filter((x) => x.status === "done" || x.status === "skipped").sort((a, b) => b.at - a.at)[0];
    if (!last) return;
    const cur = inTok(); const ch = {};
    if (cur) ch[cur.no] = { status: "waiting" };
    ch[last.no] = { status: "in" };
    await backend.adminWrite(S.key, ch, last.no); toast(`Back to #${last.no}`);
  },
  async priority(no, on) { await backend.adminWrite(S.key, { [no]: { prio: on ? Date.now() : 0 } }); },
  async set(no, status) {
    const x = tokenBy(no); const ch = { [no]: { status } };
    const current = x?.status === "in" && status !== "in" ? 0 : status === "in" ? no : undefined;
    await backend.adminWrite(S.key, ch, current);
  },
};
function bindQueue() {
  $("#q-next").onclick = () => run(() => A.next("done"));
  $("#q-skip").onclick = () => run(() => A.next("skipped"));
  $("#q-undo").onclick = () => run(() => A.undo());
  root.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { S.filter = b.dataset.f; renderConsole(); });
  root.querySelectorAll("[data-act=call]").forEach((b) => b.onclick = () => run(() => A.call(+b.dataset.no)));
  root.querySelectorAll("[data-reg]").forEach((b) => b.onclick = () => {
    const a = b.dataset.reg;
    if (a === "closeday") return openCloseDay();
    const p = {};
    if (a === "pause") p.paused = true;
    if (a === "resume") p.paused = false;
    if (a === "reopen") { p.closedDay = ""; p.closedMsg = ""; }
    if (a === "force") { p.forceOpenDay = S.key; p.paused = false; }
    if (a === "unforce") p.forceOpenDay = "";
    const msg = { pause: "Booking paused", resume: "Booking resumed", reopen: "Booking reopened", force: "Booking open for today", unforce: "Back to normal timing" }[a];
    run(() => backend.patchSettings(p), msg);
  });
  $("#announce").onclick = openAnnounce;
  $("#walkin").onclick = openWalkin;
  root.querySelectorAll("[data-menu]").forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); closeMenu();
    const no = +b.dataset.menu, x = tokenBy(no); if (!x) return;
    const items = [];
    if (x.status !== "in") items.push(["call", "Call now (with doctor)"]);
    if (isOwner() && x.status === "waiting") items.push(x.prio ? ["unprio", "Remove priority"] : ["prio", "Move to top (priority)"]);
    if (x.status !== "done") items.push(["done", "Mark done"]);
    if (x.status === "waiting" || x.status === "in") items.push(["skipped", "Mark absent"]);
    if (x.status !== "waiting") items.push(["waiting", "Put back in queue"]);
    if (x.status !== "cancelled") items.push(["cancelled", "Cancel booking", "danger"]);
    menuEl = document.createElement("div"); menuEl.className = "menu";
    menuEl.innerHTML = `<div class="hint" style="padding:6px 12px 4px">#${no} ${esc(contactOf(no).name || "")}</div>` + items.map(([k, l, c]) => `<button data-m="${k}" class="${c || ""}">${l}</button>`).join("");
    document.body.appendChild(menuEl);
    const r = b.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
    menuEl.style.left = Math.max(8, Math.min(innerWidth - mw - 8, r.right - mw)) + "px";
    menuEl.style.top = (r.bottom + mh + 8 > innerHeight ? r.top - mh - 6 : r.bottom + 6) + "px";
    menuEl.querySelectorAll("[data-m]").forEach((m) => m.onclick = async () => {
      const k = m.dataset.m; closeMenu();
      if (k === "call") return run(() => A.call(no));
      if (k === "prio" || k === "unprio") return run(() => A.priority(no, k === "prio"), k === "prio" ? `#${no} moved to the top` : "Priority removed");
      if (k === "cancelled" && !(await confirmBox(`Cancel #${no}?`, "The patient will see that their booking was cancelled. The number is not reused."))) return;
      run(() => A.set(no, k));
    });
  });
}
function openWalkin() {
  const sc = openModal(`<div class="sheet"><h3>Add walk-in patient</h3><p>Gets the next number in the same series as online bookings. Works even when online booking is closed.</p>
    <form id="wf" novalidate>
      <div class="field"><label>Name</label><input class="inp" id="w-name" maxlength="60"></div>
      <div class="field"><label>Coming from</label><input class="inp" id="w-place" maxlength="60"></div>
      <div class="field"><label>Mobile (optional)</label><div class="phone"><span class="cc">+91</span><input class="inp" id="w-phone" inputmode="numeric" maxlength="14"></div></div>
      <div class="btns"><button class="btn primary block" type="submit">Give number</button><button class="btn ghost block" type="button" data-close>Cancel</button></div>
    </form></div>`);
  setTimeout(() => $("#w-name")?.focus(), 50);
  sc.querySelector("#wf").onsubmit = async (e) => {
    e.preventDefault();
    const name = $("#w-name").value.trim(), place = $("#w-place").value.trim(), phone = cleanPhone($("#w-phone").value);
    if (name.length < 2) return toast("Enter the patient's name");
    if (phone && !/^[6-9]\d{9}$/.test(phone)) return toast("Mobile number looks wrong");
    try { const r = await backend.register(S.key, { name, place, phone }, "walkin"); closeModal(); toast(r.existing ? `Already booked: #${r.no}` : `Walk-in given #${r.no}`); }
    catch (err) { toast("Failed: " + (err.code || err.message)); }
  };
}

function openCloseDay() {
  const tom = nextDayKey(S.key);
  const sc = openModal(`<div class="sheet"><h3>Doctor not sitting / Holiday</h3><p>Online booking is closed for that day and patients see your message. It reopens by itself the next day.</p>
    <form id="cf" novalidate>
      <div class="field"><label for="c-day">Which day?</label><select class="inp" id="c-day"><option value="${S.key}">Today (${keyLabel(S.key, "en")})</option><option value="${tom}">Tomorrow (${keyLabel(tom, "en")})</option></select></div>
      <div class="field"><label for="c-msg">Message for patients (optional)</label><input class="inp" id="c-msg" maxlength="160" placeholder="e.g. Doctor is out of station. Back on Monday."></div>
      <div class="btns"><button class="btn primary block" type="submit">Close booking</button><button class="btn ghost block" type="button" data-close>Cancel</button></div>
    </form></div>`);
  sc.querySelector("#cf").onsubmit = async (e) => {
    e.preventDefault();
    const p = { closedDay: $("#c-day").value, closedMsg: $("#c-msg").value.trim().slice(0, 160) };
    try { await backend.patchSettings(p); closeModal(); toast("Booking closed for " + (p.closedDay === S.key ? "today" : "tomorrow")); }
    catch (err) { toast("Failed: " + (err.code || err.message)); }
  };
}
function openAnnounce() {
  const sc = openModal(`<div class="sheet"><h3>Announcement</h3><p>Shown at the top of the patient page until you change or clear it. Use it for breaks, delays and changed timings.</p>
    <form id="af" novalidate>
      <div class="field"><input class="inp" id="a-msg" maxlength="160" value="${esc(S.settings.notice)}" placeholder="e.g. Doctor is on a short break, back in 20 minutes"></div>
      <div class="btns"><button class="btn primary block" type="submit">Publish</button><button class="btn ghost block" type="button" id="a-clear">Clear announcement</button><button class="btn ghost block" type="button" data-close>Cancel</button></div>
    </form></div>`);
  setTimeout(() => $("#a-msg")?.focus(), 50);
  const save = async (notice) => {
    try { await backend.patchSettings({ notice }); closeModal(); toast(notice ? "Announcement published" : "Announcement cleared"); }
    catch (err) { toast("Failed: " + (err.code || err.message)); }
  };
  sc.querySelector("#af").onsubmit = (e) => { e.preventDefault(); save($("#a-msg").value.trim().slice(0, 160)); };
  sc.querySelector("#a-clear").onclick = () => save("");
}

/* ---------------- settings */
function settingsHTML() {
  const s = S.settings;
  const time = (id, v, label, hint) => `<div class="field"><label for="${id}">${label}</label><input class="inp" type="time" id="${id}" value="${toHHMM(v)}">${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;
  return `<section class="card" style="margin-top:0"><form id="setform" novalidate>
    <h2 style="font-family:var(--serif);font-weight:600;font-size:20px">Booking &amp; timings</h2>
    <div class="form-grid two">
      ${time("s-open", s.openMin, "Online booking opens", "Patients can book from this time.")}
      ${time("s-close", s.closeMin, "Online booking closes", "Walk-ins can still be added after this.")}
      ${time("s-from", s.sitFrom, "Doctor sits from", "Used for patients' expected time.")}
      ${time("s-to", s.sitTo, "Doctor sits until", "")}
      ${time("s-reset", s.resetMin, "Daily reset (numbers back to 0)", "Must be before booking opens. Yesterday's data is deleted.")}
      <div class="field"><label for="s-avg">Minutes per patient (estimate)</label><input class="inp" type="number" min="1" max="60" id="s-avg" value="${s.avgMin}"></div>
      <div class="field"><label for="s-max">Max numbers per day</label><input class="inp" type="number" min="0" max="999" id="s-max" value="${s.maxTokens}"><div class="hint">0 = no limit.</div></div>
    </div>
    <div class="sec">Weekly off</div>
    <p class="hint">Online booking stays closed on these days.</p>
    <div class="days" style="margin-top:10px">${DOW.map((d, i) => `<button type="button" data-dow="${i + 1}" class="${(s.offDays || []).includes(i + 1) ? "on" : ""}">${d}</button>`).join("")}</div>
    <div class="sec">Notice for patients</div>
    <div class="field" style="margin-top:8px"><input class="inp" id="s-notice" maxlength="160" value="${esc(s.notice)}" placeholder="e.g. Doctor will sit from 5:30 PM today"><div class="hint">Shown at the top of the patient page. Leave empty to hide.</div></div>
    <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap"><button class="btn primary" type="submit">Save settings</button><button class="btn ghost" type="button" id="s-revert">Discard changes</button></div>
  </form></section>`;
}
function bindSettings() {
  const form = $("#setform");
  form.addEventListener("input", () => (S.settingsDirty = true));
  form.querySelectorAll("[data-dow]").forEach((b) => b.onclick = () => { b.classList.toggle("on"); S.settingsDirty = true; });
  $("#s-revert").onclick = () => { S.settingsDirty = false; renderConsole(); };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const s = { ...S.settings,
      openMin: fromHHMM($("#s-open").value), closeMin: fromHHMM($("#s-close").value),
      sitFrom: fromHHMM($("#s-from").value), sitTo: fromHHMM($("#s-to").value), resetMin: fromHHMM($("#s-reset").value),
      avgMin: Math.max(1, Math.min(60, +$("#s-avg").value || 5)), maxTokens: Math.max(0, Math.min(999, Math.floor(+$("#s-max").value || 0))),
      offDays: [...form.querySelectorAll("[data-dow].on")].map((b) => +b.dataset.dow), notice: $("#s-notice").value.trim().slice(0, 160) };
    if (s.closeMin <= s.openMin) return toast("Booking must close after it opens");
    if (s.resetMin > s.openMin) return toast("Daily reset must be at or before booking opens");
    if (s.sitTo <= s.sitFrom) return toast("Doctor's end time must be after start time");
    try { await backend.saveSettings(s); S.settingsDirty = false; toast("Settings saved"); checkDayRollover(); renderConsole(); }
    catch (err) { toast("Failed: " + (err.code || err.message)); }
  };
}

/* ---------------- team */
function teamHTML() {
  const r = S.roles, me = S.auth.email;
  const person = (e, role) => `<div class="person"><div class="av">${esc(e[0])}</div><div class="e">${esc(e)}${e === me ? ` <span class="hint">(you)</span>` : ""}</div><span class="role ${role}">${role}</span>
    ${role === "owner" && r.owners.length <= 1 ? "" : `<button class="ib" data-rm="${esc(e)}" data-role="${role}" title="Remove">✕</button>`}</div>`;
  return `<section class="card" style="margin-top:0">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-family:var(--serif);font-weight:600;font-size:20px">Team</h2><button class="sbtn dark" id="addp" style="margin-left:auto">+ Add person</button></div>
    <p class="sub">Owners control everything: queue, settings and team. Admins run the queue and add walk-ins. Add as many as you need. Each person signs in with their Google account.</p>
    <div class="sec">Owners (${r.owners.length})</div><div class="people">${r.owners.map((e) => person(e, "owner")).join("")}</div>
    <div class="sec">Admins (${r.admins.length})</div><div class="people">${r.admins.length ? r.admins.map((e) => person(e, "admin")).join("") : `<p class="empty">No admins yet.</p>`}</div>
  </section>`;
}
function bindTeam() {
  $("#addp").onclick = () => {
    const sc = openModal(`<div class="sheet"><h3>Add a person</h3><p>They sign in at this page (#admin) with this Google account.</p>
      <form id="pf" novalidate><div class="field"><label>Gmail / Google account email</label><input class="inp" id="p-email" type="email" autocomplete="off" placeholder="name@gmail.com"></div>
      <div class="field"><label>Role</label><select class="inp" id="p-role"><option value="admin">Admin: runs the queue</option><option value="owner">Owner: full control</option></select></div>
      <div class="btns"><button class="btn primary block" type="submit">Add</button><button class="btn ghost block" type="button" data-close>Cancel</button></div></form></div>`);
    setTimeout(() => $("#p-email")?.focus(), 50);
    sc.querySelector("#pf").onsubmit = async (e) => {
      e.preventDefault();
      const email = $("#p-email").value.trim().toLowerCase(), role = $("#p-role").value;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast("Enter a valid email");
      const r = { owners: S.roles.owners.filter((x) => x !== email), admins: S.roles.admins.filter((x) => x !== email) };
      (role === "owner" ? r.owners : r.admins).push(email);
      try { await backend.saveRoles(r); closeModal(); toast(`${email} added as ${role}`); } catch (err) { toast("Failed: " + (err.code || err.message)); }
    };
  };
  root.querySelectorAll("[data-rm]").forEach((b) => b.onclick = async () => {
    const email = b.dataset.rm, role = b.dataset.role;
    const self = email === S.auth.email;
    if (!(await confirmBox(`Remove ${email}?`, self ? "You will lose access to this console immediately." : `They will no longer be able to ${role === "owner" ? "manage the clinic" : "run the queue"}.`, "Remove"))) return;
    const r = { owners: S.roles.owners.filter((x) => x !== email), admins: S.roles.admins.filter((x) => x !== email) };
    if (!r.owners.length) return toast("At least one owner is required");
    run(() => backend.saveRoles(r), "Removed");
  });
}

/* ================================================================ BOOT */
async function boot() {
  render();
  try {
    backend = FIREBASE_CONFIG ? await makeFirebaseBackend(FIREBASE_CONFIG) : makeDemoBackend();
  } catch (e) {
    console.error(e);
    root.insertAdjacentHTML("afterbegin", `<div class="demo">Could not load the app. Check your internet connection and refresh.</div>`);
    return;
  }
  let first = true;
  backend.onSettings((s) => {
    S.settings = s;
    const k = dayKeyFor(s);
    if (first || k !== S.key) { first = false; S.key = k; subscribeDay(); }
    render();
  });
  backend.onAuth((a) => {
    const wasAdmin = isAdmin(); const prevRole = S.auth?.role;
    S.auth = a;
    if (isAdmin() && (!wasAdmin || prevRole !== a.role)) { subscribeAdmin(); backend.cleanup(S.key).catch((e) => console.warn("cleanup", e)); }
    if (!isAdmin() && wasAdmin) subscribeAdmin();
    if (lastView === "admin") renderAdmin();
  });
  setInterval(() => { checkDayRollover(); update(); }, 30000);
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
boot();
</script>
